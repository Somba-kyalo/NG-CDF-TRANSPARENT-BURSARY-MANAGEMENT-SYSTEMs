{% extends 'base.html' %}
{% block content %}<div class="auth-shell"><section class="card auth-card"><div class="card-body"><div class="eyebrow">Secure access</div><h1 class="auth-title mb-2">Welcome back</h1><p class="text-muted mb-4">Sign in to manage your bursary application.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100 mt-2" type="submit">Sign in</button></form><div class="mt-4 d-flex flex-column flex-sm-row justify-content-between gap-2"><a href="{% url 'accounts:register' %}">Create a student account</a><a href="{% url 'accounts:password_reset' %}">Forgot password?</a></div></div></section></div>{% endblock %}
