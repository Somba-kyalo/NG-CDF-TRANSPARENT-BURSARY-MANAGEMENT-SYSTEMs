{% extends 'base.html' %}
{% block content %}<div class="auth-shell"><section class="card auth-card"><div class="card-body"><div class="eyebrow">Student access</div><h1 class="auth-title mb-2">Create your account</h1><p class="text-muted mb-4">Use your institutional email ending in <strong>.ac.ke</strong>. Your account will be reviewed before sign in is enabled.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100 mt-2" type="submit">Create account</button></form><p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{% url 'accounts:login' %}">Sign in</a></p></div></section></div>{% endblock %}
