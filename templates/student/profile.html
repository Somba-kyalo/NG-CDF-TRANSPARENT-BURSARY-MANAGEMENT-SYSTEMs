{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>My Profile</h3>
  <span class="badge text-bg-primary">Completion: {{ profile.completion_percentage }}%</span>
</div>
<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
